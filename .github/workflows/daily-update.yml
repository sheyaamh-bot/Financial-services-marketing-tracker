name: Daily tracker update

on:
  schedule:
    # 03:17 UTC = 05:17 SAST, every day. Scheduled runs only fire on the default branch.
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: competitor-tracker
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Collect coverage and rebuild Excel + dashboard
        env:
          # Optional. Add this repository secret to have Claude write the morning briefing.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python tracker.py

      - name: Commit updated data
        run: |
          git config user.name "competitor-tracker-bot"
          git config user.email "competitor-tracker-bot@users.noreply.github.com"
          git add data site
          git diff --cached --quiet || git commit -m "Daily competitor tracker update $(date -u +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
